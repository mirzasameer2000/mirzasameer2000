name: Refresh stats card

on:
  schedule:
    # Daily. Contribution counts do not move fast enough to warrant more.
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/build-stats.mjs
      - .github/workflows/stats.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render stats.svg from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: node scripts/build-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          # No-op on days where the numbers are unchanged.
          git diff --staged --quiet || git commit -m "chore: refresh stats card"
          git push
